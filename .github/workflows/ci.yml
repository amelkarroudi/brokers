name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brokers
          POSTGRES_USER: brokers
          POSTGRES_PASSWORD: brokers
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brokers" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test on H2
        run: ./gradlew build
      - name: Test API on PostgreSQL
        run: ./gradlew :api:test --rerun
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/brokers
          SPRING_DATASOURCE_USERNAME: brokers
          SPRING_DATASOURCE_PASSWORD: brokers

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
