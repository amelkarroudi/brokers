spring:
  application:
    name: brokers-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./build/data/brokers;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

brokers:
  public-base-url: ${BROKERS_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    # Base64 encoded 32-byte AES key. The default is for local development ONLY; always override in production.
    credential-key: ${BROKERS_CREDENTIAL_KEY:ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
    session-ttl: 12h
    max-failed-logins: 5
    lockout-duration: 15m
    cors-allowed-origins: ${BROKERS_CORS_ORIGINS:http://localhost:3000}
  channels:
    # By default the channels point at the built-in sandbox. Set the real partner endpoints in production.
    booking:
      base-url: ${BOOKING_API_URL:http://localhost:8080/sandbox/booking}
      connect-timeout: 5s
      read-timeout: 20s
    rentalcars:
      base-url: ${RENTALCARS_API_URL:http://localhost:8080/sandbox/rentalcars}
      connect-timeout: 5s
      read-timeout: 20s
  sync:
    worker-enabled: ${BROKERS_SYNC_WORKER_ENABLED:true}
    poll-interval: 3s
    batch-size: 50
    max-attempts: 8
    initial-backoff: 10s
    max-backoff: 30m
    stale-lock-timeout: 10m
    availability-horizon: 365d
  sandbox:
    enabled: ${BROKERS_SANDBOX_ENABLED:true}
